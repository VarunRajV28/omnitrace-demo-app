name: 2 - Failing CI Pipeline (Trigger OmniTrace)
on:
  workflow_dispatch:
jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: ./frontend
        run: |
          npm install
          npm test
  test-backend-crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: ./backend
        run: |
          pip install -r requirements.txt
          echo "Simulating a bad deployment crash for OmniTrace..."
          python -c "assert 500 == 200, 'Simulated Backend Crash: test_api.py failed'"
          pytest tests/
